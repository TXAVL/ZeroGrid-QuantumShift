name: quantumshift
description: "Zero Grid: Quantum Shift - High-Performance Pure Flutter Puzzle Game"
publish_to: 'none'
version: 1.6.1+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  
  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  
  # Monetization (AdMob, IAP, In-App Update)
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  in_app_update: ^5.0.0
  
  # Google Play Games Services (GPGS)
  games_services: ^5.3.0
  
  # Audio
  audioplayers: ^6.0.0

  # Networking & HTTP
  http: ^1.2.1

  # Path Provider, Share & Battery
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  battery_plus: ^6.2.1

  # Google Sign-In & Auth
  google_sign_in: ^6.2.1

  # Device & Package Info
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.2

  # Crypto
  crypto: ^3.0.3

  # URL Launcher
  url_launcher: ^6.3.0
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  # TODO: Bật khi có Apple Developer account
  # ios: true
  # image_path_ios: "assets/branding/logo_master.png"
  image_path: "assets/branding/logo_master.png"
  adaptive_icon_background: "assets/branding/icon_background.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/audio/
