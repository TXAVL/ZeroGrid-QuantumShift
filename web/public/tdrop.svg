<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090d1f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>

    <!-- Drop Glow Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f3ff;stop-opacity:0" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="16 12" stroke-opacity="0.3" />

  <!-- Clipboard Board Base -->
  <rect x="156" y="140" width="200" height="250" rx="26" fill="#0b1120" stroke="#6366f1" stroke-width="6" stroke-opacity="0.8" filter="url(#glow)"/>

  <!-- Clipboard Top Clip -->
  <rect x="206" y="115" width="100" height="42" rx="12" fill="#38bdf8" stroke="#ffffff" stroke-width="4"/>
  <circle cx="256" cy="136" r="7" fill="#0b1120"/>

  <!-- OCR Scanning Lines & Water Drop Motif -->
  <!-- Stylized Droplet in Center -->
  <path d="M256 185 C256 185, 310 250, 310 285 C310 315, 286 340, 256 340 C226 340, 202 315, 202 285 C202 250, 256 185, 256 185 Z"
        fill="url(#dropGrad)" filter="url(#glow)"/>

  <!-- Futuristic Inner T Cutout in Drop -->
  <path d="M226 250 H286 V268 H264 V315 H248 V268 H226 Z" fill="#090d1f" fill-opacity="0.95"/>

  <!-- Horizontal OCR Laser Scan Line -->
  <line x1="140" y1="285" x2="372" y2="285" stroke="url(#beamGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- OCR Corner brackets -->
  <path d="M 176 185 L 176 168 L 193 168" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 336 185 L 336 168 L 319 168" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 176 345 L 176 362 L 193 362" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 336 345 L 336 362 L 319 362" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
</svg>
